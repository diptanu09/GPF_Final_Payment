# ==============================================================================
# Nginx Configuration for GPF Final Payment Portal
# ==============================================================================

# ------------------------------------------------------------------------------
# HTTP Server (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gpffp.local gpf-final-payment.local gpf_final_payment.local localhost 10.47.240.169 _;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # Hide Server Version
    server_tokens off;

    # Client body size for file uploads and digital signature payloads
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Vary "X-Inertia, Accept-Encoding" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching with immutable cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|webp|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Block access to hidden files and sensitive project files
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* (\.env|\.git|\.yml|\.yaml|\.sql|\.sh|\.bat|composer\.|package\.|phpunit\.|artisan|Dockerfile|vite\.config\.) {
        deny all;
        return 404;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server (Port 443 with SSL / TLS)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gpffp.local gpf-final-payment.local gpf_final_payment.local localhost 10.47.240.169 _;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # SSL Certificate & TLS Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Hide Server Version
    server_tokens off;

    # Client body size for file uploads
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Vary "X-Inertia, Accept-Encoding" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching with immutable cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|webp|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Block access to hidden files and sensitive project files
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* (\.env|\.git|\.yml|\.yaml|\.sql|\.sh|\.bat|composer\.|package\.|phpunit\.|artisan|Dockerfile|vite\.config\.) {
        deny all;
        return 404;
    }
}
