services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpf_final_payment_app:latest
    container_name: gpf_final_payment_app
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
      - "${SSL_PORT:-443}:443"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - TNS_ADMIN=/usr/lib/oracle/current/network/admin
      - ORACLE_PROBE_TIMEOUT=${ORACLE_PROBE_TIMEOUT:-3.0}
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
      - app_logs:/var/www/html/storage/logs
      - ./docker/ssl:/etc/nginx/ssl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost/login || curl -f http://localhost/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app_storage:
    driver: local
  app_logs:
    driver: local
